# Netlify — preview deploys of the public website.
# Netlify detects Next.js and applies its Next.js runtime automatically.

[build]
  command = "yarn build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9+
  NODE_VERSION = "22"

# PREVIEW ONLY: keep the unfinished site out of search engines.
# Remove this block when the site goes live on the real domain.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
